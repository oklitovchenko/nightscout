name: Deploy Nightscout server

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      libre_sha:
        description: Commit SHA in the LibreLinkUp fork
        default: bff2317f5cc0db4a1a40971bbf601c87ab0e856d
        type: string

permissions:
  contents: read

concurrency:
  group: nightscout-server-deploy

env:
  REGISTRY: 370690050634.dkr.ecr.eu-central-1.amazonaws.com

jobs:
  ci:
    uses: ./.github/workflows/fork-ci.yml

  build:
    needs: ci
    if: github.repository == 'oklitovchenko/nightscout' && github.ref == 'refs/heads/main' && vars.NIGHTSCOUT_INSTANCE_ID != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      nightscout: ${{ steps.images.outputs.nightscout }}
      libre: ${{ steps.images.outputs.libre }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: nightscout
          persist-credentials: false
      - name: Validate LibreLinkUp revision
        env:
          LIBRE_SHA: ${{ inputs.libre_sha || 'bff2317f5cc0db4a1a40971bbf601c87ab0e856d' }}
        run: |
          [[ "$LIBRE_SHA" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: oklitovchenko/nightscout-librelink-up
          ref: ${{ inputs.libre_sha || 'bff2317f5cc0db4a1a40971bbf601c87ab0e856d' }}
          path: librelinkup
          persist-credentials: false
      - name: Build ARM64 images
        run: |
          docker build -t nightscout:staging nightscout
          docker build -f nightscout/.github/docker/librelinkup.Dockerfile -t librelinkup:staging librelinkup
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::370690050634:role/nightscout-server-build
          aws-region: eu-central-1
          allowed-account-ids: '370690050634'
      - name: Publish immutable images
        id: images
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          for app in nightscout librelinkup; do
            repo="$REGISTRY/nightscout-server/$app"
            tag="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            docker tag "$app:staging" "$repo:$tag"
            docker push "$repo:$tag"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$repo:$tag")
            key=$app
            if [[ $app == librelinkup ]]; then key=libre; fi
            echo "$key=${digest##*@}" >> "$GITHUB_OUTPUT"
          done

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
    environment: production
    if: github.repository == 'oklitovchenko/nightscout' && github.ref == 'refs/heads/main'
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::370690050634:role/nightscout-server-deploy
          aws-region: eu-central-1
          allowed-account-ids: '370690050634'
      - name: Store encrypted settings and deploy via SSM
        env:
          SETTINGS: ${{ secrets.NIGHTSCOUT_RUNTIME_JSON }}
          RUNTIME_OPTIONS: ${{ vars.NIGHTSCOUT_RUNTIME_OPTIONS_JSON || '{}' }}
          INSTANCE: ${{ vars.NIGHTSCOUT_INSTANCE_ID }}
          NIGHTSCOUT: ${{ needs.build.outputs.nightscout }}
          LIBRE: ${{ needs.build.outputs.libre }}
        run: |
          [[ "$INSTANCE" =~ ^i-[a-f0-9]{17}$ ]]
          jq -e 'type == "object" and (.API_SECRET | strings | length >= 12)' <<< "$SETTINGS" >/dev/null
          SETTINGS=$(jq -ce --argjson options "$RUNTIME_OPTIONS" '
            if ($options | type) != "object" or
              ($options | keys - ["ENABLE","DISPLAY_UNITS","TIME_FORMAT","DEVICESTATUS_ADVANCED",
                "CONNECT_SOURCE","CONNECT_LINK_UP_REGION","CONNECT_LINK_UP_SENSOR_INFO","CONNECT_LINK_UP_INTERVAL",
                "LINK_UP_REGION","BRIDGE_SERVER"] | length) != 0
            then error("Invalid Nightscout runtime options")
            else $options * . end' <<< "$SETTINGS")
          version=$(printf '%s' "$SETTINGS" | aws ssm put-parameter --name /nightscout/production/runtime \
            --type SecureString --tier Standard --value file:///dev/stdin --overwrite --query Version --output text)
          unset SETTINGS
          parameters=$(jq -cn --arg nightscout "$NIGHTSCOUT" --arg libre "$LIBRE" --arg version "$version" \
            '{nightscout:[$nightscout],libre:[$libre],configVersion:[$version]}')
          command=$(aws ssm send-command --document-name NightscoutServerDeploy --instance-ids "$INSTANCE" \
            --parameters "$parameters" --query Command.CommandId --output text)
          for attempt in {1..85}; do
            status=$(aws ssm get-command-invocation --command-id "$command" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null) || status=Pending
            case "$status" in
              Success) echo "Nightscout deployment and authenticated API check passed"; exit 0 ;;
              Pending|InProgress|Delayed) sleep 10 ;;
              *) echo "SSM command $command ended with status $status"; exit 1 ;;
            esac
          done
          echo "SSM command $command did not finish in time"
          exit 1
